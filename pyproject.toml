[project]
name = "procurement-ops"
version = "0.1.0"
description = "Procurement operations agent"
readme = { file = "README", content-type = "text/plain" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
