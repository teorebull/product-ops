[project]
name = "procurement-ops"
version = "0.1.0"
description = "Procurement operations agent"
readme = { file = "README", content-type = "text/plain" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.3",
    "pydantic>=2.0",
    "pymupdf>=1.28.2",
    "langchain>=1.4.3",
    "langchain-text-splitters>=1.1.2",
    "ipython>=9.17.1",
    "chromadb>=1.5.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
